name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Required Android CI
    uses: ./.github/workflows/release-apk.yml
    with:
      ref: ${{ github.sha }}
