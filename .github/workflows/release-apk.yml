name: Build APK

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed release APK (requires the Android signing secrets)
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      signed:
        type: boolean
        default: false
      release-tag:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      artifact-name:
        description: Artifact containing the APK and its SHA-256 checksum
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Validate version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        if: inputs.signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name. Configure it in repository Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter test --no-pub

      - name: Build debug APK for CI
        if: ${{ !inputs.signed }}
        run: flutter build apk --debug --no-pub

      - name: Build signed release APK
        if: inputs.signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --no-pub
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify build/app/outputs/flutter-apk/app-release.apk

      - name: Package APK and checksum
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ inputs.signed }}
        run: |
          mkdir -p dist
          if [[ "$SIGNED" == true ]]; then
            apk="SimpleRunning-$VERSION.apk"
            cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          else
            apk="SimpleRunning-$VERSION-debug.apk"
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/$apk"
          fi
          (cd dist && sha256sum "$apk" > "$apk.sha256")
          echo "artifact-name=SimpleRunning-$VERSION-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
