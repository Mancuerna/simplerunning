name: simplerunning
description: "Offline treadmill training, intervals and running plans."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.2+9

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_reactive_ble: 5.5.0
  # Keep the native implementation compatible with Android SDK 36.
  reactive_ble_mobile: 5.5.0
  permission_handler: ^12.0.1
  device_info_plus: ^13.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
